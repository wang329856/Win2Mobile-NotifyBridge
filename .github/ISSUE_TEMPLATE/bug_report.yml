name: 缺陷反馈
description: 报告安装、配对、通知接收或界面问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [安装与常见问题](https://github.com/wang329856/Win2Mobile-NotifyBridge/blob/master/docs/installation.md) 和已有 Issue。
        请用虚构通知复现。不要上传二维码、配对码、topic、token、密钥、完整数据库或未脱敏的通知内容。
        安全漏洞优先按隐私说明中的安全反馈方式处理，不在公开 Issue 披露可利用细节。
  - type: input
    id: windows-version
    attributes:
      label: Windows 客户端版本
      description: 请填写 Win2Mobile 版本与安装来源；仅手机问题可填“不涉及”。
      placeholder: "例如：3.1.2，GitHub Release MSIX"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android 客户端版本
      description: 请注明正式 APK、debug APK 或自行构建；仅电脑问题可填“不涉及”。
      placeholder: "例如：3.1.2，GitHub Release 正式 APK"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 系统与设备
      description: Windows 版本及 build、Android 版本、手机型号；自行构建请补充提交号。
      placeholder: |
        Windows：
        Android / 手机型号：
        自行构建的提交号（如适用）：
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 连接模式
      options:
        - 仅局域网
        - 自动（局域网优先）
        - 仅跨网络（ntfy.sh）
        - 仅跨网络（自建 ntfy）
        - 不涉及连接 / 尚未配对
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从什么操作开始？是否每次出现？屏幕开启和息屏是否不同？
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请附错误码或界面状态，例如 HTTP 429、等待批准、需要重新授权。
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: 网络与后台情况（如适用）
      description: 不需要填写真实地址、topic 或凭据；代理地址请隐去敏感信息。
      placeholder: |
        两端是否在同一可互通局域网：
        两端是否分别能访问中转：
        是否有访客 Wi-Fi / VPN / 代理：
        是否在息屏或电池优化下出现：
        是否出现限流或缓存缺口：
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的截图或日志（可选）
      description: 遮盖消息内容、IP、设备名、二维码和凭据，不上传数据库或签名材料。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已查看教程和现有 Issue。
          required: true
        - label: 我已检查附件与文本，不含通知隐私、配对材料、topic、token、密钥或完整数据库。
          required: true
